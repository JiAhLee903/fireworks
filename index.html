<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🦁 삼성 라이온즈 폭죽</title>
<style>
  html,body{margin:0;height:100%;background:#010510;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hint{position:fixed;left:0;right:0;bottom:24px;text-align:center;color:#8fb4ffaa;
        font:14px -apple-system,sans-serif;pointer-events:none;transition:opacity 1s}
  #finale{position:fixed;top:14px;right:14px;padding:8px 14px;border-radius:20px;border:1px solid #4d8dff;
        background:#0a2a6a99;color:#cfe0ff;font:600 13px -apple-system,sans-serif;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="finale">🎆 피날레!</button>
<div id="hint">화면을 터치/클릭하면 폭죽이 터져요 🦁💙</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr;
function resize(){
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

const rand = (a,b)=>a+Math.random()*(b-a);
const pick = a=>a[Math.floor(Math.random()*a.length)];
const rockets = [], sparks = [], rings = [];
let flash = 0, flashHue = 215;

// ---- 팔레트: 라이온즈 블루 중심 + 흰색/하늘색/금색 포인트 ----
function lionsColor(){
  const r = Math.random();
  if(r < .45) return {h:215, s:100, l:rand(50,62)};
  if(r < .7)  return {h:200, s:100, l:rand(66,78)};
  if(r < .87) return {h:215, s:25,  l:96};
  return {h:45, s:100, l:rand(58,66)};                // 금빛 포인트
}

// ---- 글자/이모지 → 점 좌표 ----
const shapeCache = {};
function sampleShape(sh){
  if(shapeCache[sh.key]) return shapeCache[sh.key];
  const o = document.createElement('canvas'); o.width = sh.w; o.height = sh.h;
  const c = o.getContext('2d');
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
  sh.draw(c, sh.w, sh.h);
  const d = c.getImageData(0,0,sh.w,sh.h).data, pts = [], step = sh.step || 4;
  for(let y=0;y<sh.h;y+=step) for(let x=0;x<sh.w;x+=step)
    if(d[(y*sh.w+x)*4+3] > 128) pts.push([(x-sh.w/2)/sh.w, (y-sh.h/2)/sh.w]);
  return shapeCache[sh.key] = pts;
}
const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const SHAPES = [
  { key:'L',     w:240, h:240, wide:.36, draw:(c,w,h)=>{ c.font=`900 230px ${FONT}`; c.fillText('L',w/2,h/2+8); } },
  { key:'LIONS', w:620, h:170, wide:.8,  draw:(c,w,h)=>{ c.font=`900 150px ${FONT}`; c.fillText('LIONS',w/2,h/2+6); } },
  { key:'삼성',  w:420, h:200, wide:.62, draw:(c,w,h)=>{ c.font=`900 170px ${FONT}`; c.fillText('삼성',w/2,h/2+6); } },
  { key:'lion',  w:260, h:260, wide:.4, step:3, draw:(c,w,h)=>{ c.font='210px sans-serif'; c.fillText('🦁',w/2,h/2+10); } },
  { key:'star',  w:240, h:240, wide:.34, draw:(c,w,h)=>{ c.font='200px sans-serif'; c.fillText('⭐',w/2,h/2+8); } },
];

// ---- 입자 ----
function spark(x,y,vx,vy,o={}){
  sparks.push(Object.assign({x,y,vx,vy,tx:null,ty:null,age:0,life:1,decay:rand(.008,.016),
    c:lionsColor(),size:rand(1.2,2.6),trail:[],drag:.975,grav:.05,glitter:false,sub:false}, o));
}

// 폭발 종류
function burstSphere(x,y,n=170,speed=7){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=speed*Math.sqrt(Math.random());
    spark(x,y,Math.cos(a)*v,Math.sin(a)*v);
  }
}
function burstRing(x,y,n=110,speed=6.5,tilt=1){
  const col = lionsColor();
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2;
    spark(x,y,Math.cos(a)*speed,Math.sin(a)*speed*tilt,{c:col});
  }
}
function burstWillow(x,y){           // 길게 늘어지며 떨어지는 금빛 버드나무
  for(let i=0;i<120;i++){
    const a=Math.random()*Math.PI*2, v=rand(2,6.5);
    spark(x,y,Math.cos(a)*v,Math.sin(a)*v,{c:{h:42,s:100,l:rand(60,72)},decay:rand(.004,.007),
      drag:.968,grav:.07,glitter:true,size:1.6});
  }
}
function burstPalm(x,y){             // 가지가 갈라지는 야자수
  const arms = 9;
  for(let k=0;k<arms;k++){
    const a=(k/arms)*Math.PI*2+rand(-.1,.1);
    for(let j=0;j<14;j++){
      const v=rand(3,8);
      spark(x,y,Math.cos(a)*v+rand(-.3,.3),Math.sin(a)*v+rand(-.3,.3),
        {c:{h:215,s:100,l:rand(58,75)},size:2.2,decay:rand(.006,.01)});
    }
  }
}
function burstCrackle(x,y){          // 터지면서 한 번 더 작게 터지는 불꽃
  for(let i=0;i<46;i++){
    const a=Math.random()*Math.PI*2, v=rand(3,7);
    spark(x,y,Math.cos(a)*v,Math.sin(a)*v,{c:{h:215,s:25,l:97},size:2.4,sub:true,decay:rand(.012,.02)});
  }
}
function burstShape(x,y,sh){         // 글자/사자 모양
  const pts = sampleShape(sh);
  const scale = Math.min(W*sh.wide, 520*(sh.wide/.38));
  const cx = Math.min(Math.max(x, scale/2+10), W-scale/2-10);
  const cy = Math.max(y, scale*.35+10);
  pts.forEach(([px,py])=>{
    const a=Math.random()*Math.PI*2, v=rand(4,10);
    const col = Math.random()<.2 ? {h:45,s:100,l:65} : (Math.random()<.25 ? {h:215,s:25,l:97} : {h:215,s:100,l:rand(52,66)});
    spark(x,y,Math.cos(a)*v,Math.sin(a)*v,{tx:cx+px*scale,ty:cy+py*scale,c:col,size:2.3,decay:0,glitter:true});
  });
  burstSphere(x,y,60,8);
  burstRing(x,y,70,9);
}

function explode(x,y){
  flash = Math.min(.22, flash+.12);
  rings.push({x,y,r:6,a:.9});                          // 충격파
  const r = Math.random();
  if(r < .42)      burstShape(x,y,pick(SHAPES));
  else if(r < .56) { burstSphere(x,y); burstRing(x,y,100,4); }
  else if(r < .68) burstWillow(x,y);
  else if(r < .80) burstPalm(x,y);
  else if(r < .90) { burstRing(x,y,110,7,1); burstRing(x,y,110,5,.35); burstSphere(x,y,60,3); }
  else             burstCrackle(x,y);
}

function launch(tx,ty,delay=0){
  const go=()=>rockets.push({x:tx+rand(-30,30),y:H,tx,ty,vy:-rand(10,14),trail:[]});
  delay ? setTimeout(go,delay) : go();
}

function finale(){
  for(let i=0;i<22;i++) launch(rand(W*.08,W*.92), rand(H*.12,H*.5), i*140);
  [0,1,2].forEach((k)=>launch(W/2+(k-1)*W*.22, H*.3, 1800+k*250));
}
document.getElementById('finale').addEventListener('pointerdown',e=>{e.stopPropagation();finale();});

// ---- 렌더 루프 ----
function frame(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(1,5,16,0.2)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  if(flash>.005){                                        // 하늘 번쩍
    const g=ctx.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.7);
    g.addColorStop(0,`hsla(215,100%,60%,${flash})`); g.addColorStop(1,'hsla(215,100%,40%,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H); flash*=.9;
  }

  for(let i=rings.length-1;i>=0;i--){                    // 충격파 링
    const o=rings[i]; o.r+=9; o.a*=.9;
    if(o.a<.03){rings.splice(i,1);continue;}
    ctx.strokeStyle=`hsla(210,100%,80%,${o.a})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,7); ctx.stroke();
  }

  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.trail.push([r.x,r.y]); if(r.trail.length>10) r.trail.shift();
    r.y+=r.vy; r.vy*=.985;
    ctx.strokeStyle='hsl(212 100% 88%)'; ctx.lineWidth=2.4;
    ctx.beginPath(); r.trail.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    if(Math.random()<.7) spark(r.x,r.y,rand(-.5,.5),rand(.5,1.5),{c:{h:40,s:100,l:70},size:1,decay:.05});
    if(r.y<=r.ty || r.vy>-1.5){ explode(r.x,r.y); rockets.splice(i,1); }
  }

  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.age++;
    s.trail.push([s.x,s.y]); if(s.trail.length>(s.glitter?6:4)) s.trail.shift();
    let hold=false;
    if(s.tx!=null){                                      // 모양 형성
      if(s.age<14){ s.x+=s.vx; s.y+=s.vy; s.vx*=.92; s.vy*=.92; }
      else if(s.age<100){ s.x+=(s.tx-s.x)*.12; s.y+=(s.ty-s.y)*.12; hold=s.age>30; }
      else { s.tx=null; s.decay=rand(.01,.022); s.vx=rand(-.4,.4); s.vy=rand(0,.8); }
    } else {
      s.vx*=s.drag; s.vy=s.vy*s.drag+s.grav;
      s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
      if(s.life<=0){
        if(s.sub){ for(let k=0;k<7;k++){const a=Math.random()*6.28,v=rand(1,3);
          spark(s.x,s.y,Math.cos(a)*v,Math.sin(a)*v,{c:{h:215,s:30,l:95},size:1.4,decay:.03}); } }
        sparks.splice(i,1); continue;
      }
    }
    let a=(s.tx!=null&&s.age>=14?1:s.life);
    if(s.glitter) a*= (Math.random()>.35?1:.25);         // 반짝임
    else a*= Math.random()>.08?1:.4;
    ctx.strokeStyle=`hsla(${s.c.h} ${s.c.s}% ${s.c.l}% / ${a})`;
    ctx.lineWidth=s.size*(hold?1.15:1);
    ctx.beginPath(); s.trail.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.lineTo(s.x+.01,s.y); ctx.stroke();
  }
  if(sparks.length>6000) sparks.splice(0,sparks.length-6000);   // 성능 보호
  requestAnimationFrame(frame);
}
frame();

cv.addEventListener('pointerdown',e=>{
  launch(e.clientX,e.clientY);
  launch(e.clientX+rand(-120,120),e.clientY+rand(-80,80),180);
  document.getElementById('hint').style.opacity=0;
});
setInterval(()=>launch(rand(W*.15,W*.85),rand(H*.2,H*.5)),900);
setInterval(()=>launch(rand(W*.15,W*.85),rand(H*.15,H*.45),400),1700);
setTimeout(finale,600);
</script>
</body>
</html>
