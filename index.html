<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🎆 폭죽놀이</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hint{position:fixed;left:0;right:0;bottom:24px;text-align:center;color:#fff8;
        font:14px -apple-system,sans-serif;pointer-events:none;transition:opacity 1s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">화면을 터치/클릭하면 폭죽이 터져요 🎆</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr;
function resize(){
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

const rockets = [], sparks = [];
const rand = (a,b)=>a+Math.random()*(b-a);

// 로켓: 아래에서 목표 지점까지 올라간 뒤 폭발
function launch(tx, ty){
  rockets.push({x: tx + rand(-40,40), y: H, tx, ty, vy: -rand(9,13),
                hue: rand(0,360), trail: []});
}

function explode(x, y, hue){
  const shape = ['circle','ring','heart','double'][Math.floor(Math.random()*4)];
  const make = (n, speed, h)=>{
    for(let i=0;i<n;i++){
      let a = (i/n)*Math.PI*2, s = speed;
      if(shape==='circle') { a = Math.random()*Math.PI*2; s = speed*Math.sqrt(Math.random()); }
      let vx, vy;
      if(shape==='heart'){
        const t = a;
        vx = 16*Math.sin(t)**3 * speed/16;
        vy = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) * speed/16;
      } else { vx = Math.cos(a)*s; vy = Math.sin(a)*s; }
      sparks.push({x,y,vx,vy,life:1,decay:rand(.008,.016),
                   hue:h+rand(-15,15),size:rand(1.2,2.4),trail:[]});
    }
  };
  if(shape==='double'){ make(70,6,hue); make(40,3,(hue+180)%360); }
  else if(shape==='ring') make(90,5.5,hue);
  else if(shape==='heart') make(110,7,330);
  else make(120,6.5,hue);
}

function frame(){
  // 잔상 효과
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = 'rgba(5,6,15,0.22)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation = 'lighter';

  for(let i=rockets.length-1;i>=0;i--){
    const r = rockets[i];
    r.trail.push([r.x,r.y]); if(r.trail.length>8) r.trail.shift();
    r.y += r.vy; r.vy *= 0.985;
    ctx.strokeStyle = `hsl(${r.hue} 100% 80%)`; ctx.lineWidth = 2;
    ctx.beginPath(); r.trail.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    if(r.y <= r.ty || r.vy > -1.5){ explode(r.x, r.y, r.hue); rockets.splice(i,1); }
  }

  for(let i=sparks.length-1;i>=0;i--){
    const s = sparks[i];
    s.trail.push([s.x,s.y]); if(s.trail.length>5) s.trail.shift();
    s.vx *= 0.975; s.vy = s.vy*0.975 + 0.05;   // 공기저항 + 중력
    s.x += s.vx; s.y += s.vy; s.life -= s.decay;
    if(s.life <= 0){ sparks.splice(i,1); continue; }
    const flicker = Math.random() > .1 ? 1 : .3;
    ctx.strokeStyle = `hsla(${s.hue} 100% 65% / ${s.life*flicker})`;
    ctx.lineWidth = s.size;
    ctx.beginPath(); s.trail.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.lineTo(s.x,s.y); ctx.stroke();
  }
  requestAnimationFrame(frame);
}
frame();

// 터치/클릭 → 그 위치로 발사
cv.addEventListener('pointerdown', e=>{
  launch(e.clientX, e.clientY);
  document.getElementById('hint').style.opacity = 0;
});
// 가만히 있어도 자동으로 터짐
setInterval(()=>launch(rand(W*.15,W*.85), rand(H*.12,H*.45)), 900);
for(let i=0;i<3;i++) setTimeout(()=>launch(rand(W*.2,W*.8), rand(H*.15,H*.4)), i*300);
</script>
</body>
</html>
