<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>💗 미니야 사랑해</title>
<style>
  html,body{margin:0;height:100%;background:#0d0214;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  #hint{position:fixed;left:0;right:0;bottom:24px;text-align:center;color:#ffb3d9aa;
        font:14px -apple-system,sans-serif;pointer-events:none;transition:opacity 1s}
  #again{position:fixed;top:14px;right:14px;padding:8px 14px;border-radius:20px;border:1px solid #ff6fb5;
        background:#6a0a4a99;color:#ffd6ec;font:600 13px -apple-system,sans-serif;cursor:pointer}
  #msg{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff;
        font:800 clamp(26px,7vw,56px) -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
        text-shadow:0 0 18px #ff4fa3,0 0 40px #ff4fa3;opacity:0;pointer-events:none;transition:opacity 1.6s;line-height:1.5;padding:0 20px}
  #err{position:fixed;left:8px;right:8px;top:50px;color:#ff8;font:11px monospace;white-space:pre-wrap;pointer-events:none;margin:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"></div>
<button id="again">💗 다시 보기</button>
<div id="hint">화면을 터치하면 하트가 터져요 💗</div>
<pre id="err"></pre>
<script>
window.onerror=(m,u,l)=>{document.getElementById('err').textContent+='오류: '+m+' (줄 '+l+')\n'};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr;
function resize(){
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

const rand = (a,b)=>a+Math.random()*(b-a);
const pick = a=>a[Math.floor(Math.random()*a.length)];
const rockets = [], sparks = [], rings = [];
let flash = 0;

// ---- 팔레트: 핑크 / 코랄 / 라벤더 / 금색 / 흰색 ----
function loveColor(){
  const r = Math.random();
  if(r < .35) return {h:330, s:100, l:rand(60,72)};   // 핫핑크
  if(r < .55) return {h:350, s:100, l:rand(62,72)};   // 코랄
  if(r < .72) return {h:285, s:90,  l:rand(70,80)};   // 라벤더
  if(r < .86) return {h:45,  s:100, l:rand(62,70)};   // 금색
  return {h:330, s:30, l:96};                          // 흰색
}

// ---- 글자/하트 → 점 좌표 ----
const shapeCache = {};
function sampleShape(sh){
  if(shapeCache[sh.key]) return shapeCache[sh.key];
  const o = document.createElement('canvas'); o.width = sh.w; o.height = sh.h;
  const c = o.getContext('2d');
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
  sh.draw(c, sh.w, sh.h);
  const d = c.getImageData(0,0,sh.w,sh.h).data, pts = [], step = sh.step || 4;
  for(let y=0;y<sh.h;y+=step) for(let x=0;x<sh.w;x+=step)
    if(d[(y*sh.w+x)*4+3] > 128) pts.push([(x-sh.w/2)/sh.w, (y-sh.h/2)/sh.w]);
  return shapeCache[sh.key] = pts;
}
const FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';
const text = (key,str,w,h,wide,font)=>({key,w,h,wide,draw:(c,W_,H_)=>{c.font=`900 ${font}px ${FONT}`;c.fillText(str,W_/2,H_/2+6);}});
const SH = {
  mini:   text('미니야','미니야',480,200,.72,170),
  friend: text('우리 우정','우리 우정',640,200,.88,165),
  forever:text('영원하자','영원하자',640,200,.88,165),
  love:   text('사랑해','사랑해',520,200,.78,170),
  heart:  { key:'heart', w:260, h:260, wide:.5, step:3, draw:(c,w,h)=>{
    c.beginPath();
    for(let t=0;t<=Math.PI*2;t+=.02){
      const x=16*Math.sin(t)**3, y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      const px=w/2+x*7, py=h/2+(y-2.5)*7; t?c.lineTo(px,py):c.moveTo(px,py);
    } c.closePath(); c.fill(); } },
  emoji:  { key:'emoji', w:260, h:260, wide:.42, step:3, draw:(c,w,h)=>{ c.font='170px sans-serif'; c.fillText('💗',w/2,h/2+8); } },
};
const RANDOM_SHAPES = [SH.mini, SH.friend, SH.forever, SH.love, SH.heart, SH.heart, SH.emoji];

// ---- 입자 ----
function spark(x,y,vx,vy,o={}){
  sparks.push(Object.assign({x,y,vx,vy,tx:null,ty:null,age:0,life:1,decay:rand(.008,.016),
    c:loveColor(),size:rand(1.2,2.6),trail:[],drag:.975,grav:.05,glitter:false,sub:false}, o));
}
function burstSphere(x,y,n=170,speed=7){
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=speed*Math.sqrt(Math.random()); spark(x,y,Math.cos(a)*v,Math.sin(a)*v); }
}
function burstRing(x,y,n=110,speed=6.5,tilt=1){
  const col = loveColor();
  for(let i=0;i<n;i++){ const a=(i/n)*Math.PI*2; spark(x,y,Math.cos(a)*speed,Math.sin(a)*speed*tilt,{c:col}); }
}
function burstHeart(x,y){            // 하트 모양으로 퍼지는 폭죽
  const col = pick([{h:340,s:100,l:65},{h:325,s:100,l:68},{h:350,s:100,l:66}]);
  for(let i=0;i<150;i++){
    const t=(i/150)*Math.PI*2;
    const hx=16*Math.sin(t)**3, hy=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
    spark(x,y,hx*.42,hy*.42,{c:col,size:2.4,drag:.97,decay:rand(.007,.011)});
  }
}
function burstWillow(x,y){
  for(let i=0;i<120;i++){
    const a=Math.random()*Math.PI*2, v=rand(2,6.5);
    spark(x,y,Math.cos(a)*v,Math.sin(a)*v,{c:{h:42,s:100,l:rand(62,74)},decay:rand(.004,.007),drag:.968,grav:.07,glitter:true,size:1.6});
  }
}
function burstCrackle(x,y){
  for(let i=0;i<46;i++){
    const a=Math.random()*Math.PI*2, v=rand(3,7);
    spark(x,y,Math.cos(a)*v,Math.sin(a)*v,{c:{h:330,s:30,l:97},size:2.4,sub:true,decay:rand(.012,.02)});
  }
}
function burstShape(x,y,sh){
  const pts = sampleShape(sh);
  const scale = Math.min(W*sh.wide, 560*(sh.wide/.4));
  const hh = scale*sh.h/sh.w;
  const cx = Math.min(Math.max(x, scale/2+10), W-scale/2-10);
  const cy = Math.max(y, hh/2+20);
  pts.forEach(([px,py])=>{
    const a=Math.random()*Math.PI*2, v=rand(4,10);
    const col = Math.random()<.2 ? {h:45,s:100,l:68} : (Math.random()<.25 ? {h:330,s:30,l:97} : {h:pick([330,340,350]),s:100,l:rand(60,72)});
    spark(x,y,Math.cos(a)*v,Math.sin(a)*v,{tx:cx+px*scale,ty:cy+py*scale,c:col,size:2.3,decay:0,glitter:true});
  });
  burstSphere(x,y,60,8);
  burstRing(x,y,70,9);
}

function explode(x,y,shape){
  flash = Math.min(.22, flash+.12);
  rings.push({x,y,r:6,a:.9});
  if(shape){ burstShape(x,y,shape); return; }
  const r = Math.random();
  if(r < .32)      burstShape(x,y,pick(RANDOM_SHAPES));
  else if(r < .52) burstHeart(x,y);
  else if(r < .64) { burstSphere(x,y); burstRing(x,y,100,4); }
  else if(r < .76) burstWillow(x,y);
  else if(r < .90) { burstRing(x,y,110,7,1); burstRing(x,y,110,5,.35); burstSphere(x,y,60,3); }
  else             burstCrackle(x,y);
}

function launch(tx,ty,delay=0,shape=null){
  const go=()=>rockets.push({x:tx+rand(-20,20),y:H,tx,ty,vy:-rand(10,14),trail:[],shape});
  delay ? setTimeout(go,delay) : go();
}

// ---- 스토리: 메시지가 순서대로 터진다 ----
const msg = document.getElementById('msg');
function say(t,ms=2600){ msg.textContent=t; msg.style.opacity=1; setTimeout(()=>msg.style.opacity=0, ms); }
function story(){
  const cx=W/2, cy=H*.34;
  launch(cx,cy,0,SH.mini);        setTimeout(()=>say('미니야 💗'),1500);
  launch(cx,cy,3600,SH.friend);   launch(cx,cy+H*.2,4300);
  launch(cx,cy,7000,SH.forever);  setTimeout(()=>say('우리 우정 영원하자',3200),8200);
  launch(cx,cy,10800,SH.love);    launch(cx-W*.25,cy+H*.1,11200); launch(cx+W*.25,cy+H*.1,11400);
  setTimeout(()=>say('사랑해 💗',3000),12200);
  launch(cx,cy,14500,SH.heart);
  for(let i=0;i<14;i++) launch(rand(W*.1,W*.9),rand(H*.15,H*.5),15000+i*160);
}
document.getElementById('again').addEventListener('pointerdown',e=>{e.stopPropagation();story();});

// ---- 렌더 루프 ----
function frame(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(13,2,20,0.2)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  if(flash>.005){
    const g=ctx.createRadialGradient(W/2,H*.4,0,W/2,H*.4,Math.max(W,H)*.7);
    g.addColorStop(0,`hsla(330,100%,60%,${flash})`); g.addColorStop(1,'hsla(330,100%,40%,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H); flash*=.9;
  }
  for(let i=rings.length-1;i>=0;i--){
    const o=rings[i]; o.r+=9; o.a*=.9;
    if(o.a<.03){rings.splice(i,1);continue;}
    ctx.strokeStyle=`hsla(330,100%,80%,${o.a})`; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,7); ctx.stroke();
  }
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.trail.push([r.x,r.y]); if(r.trail.length>10) r.trail.shift();
    r.y+=r.vy; r.vy*=.985;
    ctx.strokeStyle='hsl(335 100% 88%)'; ctx.lineWidth=2.4;
    ctx.beginPath(); r.trail.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.stroke();
    if(Math.random()<.7) spark(r.x,r.y,rand(-.5,.5),rand(.5,1.5),{c:{h:40,s:100,l:70},size:1,decay:.05});
    if(r.y<=r.ty || r.vy>-1.5){ explode(r.x,r.y,r.shape); rockets.splice(i,1); }
  }
  for(let i=sparks.length-1;i>=0;i--){
    const s=sparks[i];
    s.age++;
    s.trail.push([s.x,s.y]); if(s.trail.length>(s.glitter?6:4)) s.trail.shift();
    let hold=false;
    if(s.tx!=null){
      if(s.age<14){ s.x+=s.vx; s.y+=s.vy; s.vx*=.92; s.vy*=.92; }
      else if(s.age<120){ s.x+=(s.tx-s.x)*.12; s.y+=(s.ty-s.y)*.12; hold=s.age>30; }
      else { s.tx=null; s.decay=rand(.01,.022); s.vx=rand(-.4,.4); s.vy=rand(0,.8); }
    } else {
      s.vx*=s.drag; s.vy=s.vy*s.drag+s.grav;
      s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
      if(s.life<=0){
        if(s.sub){ for(let k=0;k<7;k++){const a=Math.random()*6.28,v=rand(1,3);
          spark(s.x,s.y,Math.cos(a)*v,Math.sin(a)*v,{c:{h:330,s:30,l:95},size:1.4,decay:.03}); } }
        sparks.splice(i,1); continue;
      }
    }
    let a=(s.tx!=null&&s.age>=14?1:s.life);
    if(s.glitter) a*= (Math.random()>.35?1:.25); else a*= Math.random()>.08?1:.4;
    ctx.strokeStyle=`hsla(${s.c.h} ${s.c.s}% ${s.c.l}% / ${a})`;
    ctx.lineWidth=s.size*(hold?1.15:1);
    ctx.beginPath(); s.trail.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ctx.lineTo(s.x+.01,s.y); ctx.stroke();
  }
  if(sparks.length>6000) sparks.splice(0,sparks.length-6000);
  requestAnimationFrame(frame);
}
frame();

cv.addEventListener('pointerdown',e=>{
  launch(e.clientX,e.clientY,0,Math.random()<.5?SH.heart:null);
  launch(e.clientX+rand(-120,120),e.clientY+rand(-80,80),180);
  document.getElementById('hint').style.opacity=0;
});
setTimeout(story,500);
setInterval(()=>{ if(!rockets.length && sparks.length<300) launch(rand(W*.15,W*.85),rand(H*.2,H*.5)); },2500);
</script>
</body>
</html>
